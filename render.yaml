services:
  - type: web
    name: real-estate-fullstack
    runtime: python
    buildCommand: |
      # Устанавливаем backend зависимости
      cd backend && pip install -r requirements.txt && cd ..

      # Устанавливаем Node.js и собираем frontend
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      nvm install 18
      nvm use 18

      cd frontend
      npm install
      VITE_API_URL=/api npm run build
      cd ..
    startCommand: cd backend && python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: DATABASE_URL
        value: sqlite:///./real_estate.db
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: "*"
